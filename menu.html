<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu — Ember &amp; Salt</title>
  <meta name="description" content="A short seasonal menu cooked over live fire.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="menu">
  <div class="curtain"><span>Ember &amp; Salt</span></div>

  <main>
    <section class="phero">
      <div class="hero__media"><img class="hero__bg" data-speed="8" data-img="plate" data-w="1800" alt=""></div>
      <div class="wrap hero__inner">
        <p class="eyebrow hero__meta">The menu</p>
        <h1 class="hero__title">
          <span class="ln"><span>Tonight,</span></span>
          <span class="ln"><span><em>from the fire.</em></span></span>
        </h1>
      </div>
    </section>

    <section class="menu">
      <div class="book-stage">
        <div class="wrap">
          <div class="book" id="book"></div>
          <div class="book__ctrl">
            <button class="book__btn" id="bookPrev" type="button" aria-label="Previous page">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Previous</span>
            </button>
            <p class="book__count" id="bookCount" aria-live="polite"></p>
            <button class="book__btn" id="bookNext" type="button" aria-label="Next page">
              <span>Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="wrap">
        <p class="menu__note reveal"><b>V</b> Vegetarian &nbsp;·&nbsp; <b>GF</b> Gluten-free &nbsp;·&nbsp; Please tell us about allergies before ordering. Menu changes with the market.</p>
      </div>
    </section>

    <section class="cta">
      <div class="wrap">
        <h2 class="split">Hungry yet?</h2>
        <a href="reservations.html" class="btn mag reveal">Reserve a table</a>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
